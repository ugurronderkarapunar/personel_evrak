name: Günlük belge kontrolü
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 08:00 İstanbul
  workflow_dispatch:       # elle test için
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary requests
      - run: python check_expiry.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_APIKEY: ${{ secrets.WA_APIKEY }}
